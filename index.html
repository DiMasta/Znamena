<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Игра с знамена</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #ffffff;
      color: #111111;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      overflow: hidden;
    }

    /* Each variant is a full-screen view; only one is shown at a time. */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      /* Space reserved for the top control bar and the bottom counter. */
      --top: calc(76px + env(safe-area-inset-top, 0px));
      --bottom: calc(56px + env(safe-area-inset-bottom, 0px));
    }

    .hidden {
      display: none;
    }

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      transition: transform 0.08s ease, background-color 0.08s ease;
    }

    /* Press feedback: buttons shrink and darken while held. */
    button.pressed {
      transform: scale(0.92);
    }

    /* ---- Main menu ---- */
    .menu-title {
      font-size: clamp(32px, 8vw, 64px);
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 44px;
      text-transform: uppercase;
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      max-width: 340px;
    }

    .menu-btn {
      border: 2px solid #111111;
      background: #ffffff;
      color: #111111;
      border-radius: 14px;
      padding: 20px 24px;
      font-size: 22px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .menu-btn.pressed {
      background: #e6e6e6;
    }

    /* ---- Top control bar and bottom counter, shared by the variants ---- */
    .controls {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 16px;
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
      padding-bottom: 14px;
      z-index: 10;
    }

    .ctrl {
      border: 1px solid #dddddd;
      background: #f5f5f5;
      color: #333333;
      border-radius: 12px;
      height: 48px;
      min-width: 58px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }

    .ctrl.pressed {
      background: #d4d4d4;
    }

    .counter {
      position: fixed;
      left: 20px;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      font-size: 20px;
      font-weight: 600;
      color: #999999;
      letter-spacing: 1px;
    }

    /* A flag inside a fixed box: identical footprint, border hugs the flag. */
    .flag-box {
      position: relative;
      aspect-ratio: 3 / 2;
    }

    /* Taken out of the flow and centred, so an unusually shaped flag
       (like Nepal's tall one) shrinks to fit instead of stretching the box. */
    .flag-box img {
      position: absolute;
      inset: 0;
      margin: auto;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      border: 1px solid #000000;
      -webkit-user-drag: none;
    }

    /* Nepal's flag is not rectangular, so a rectangular border looks wrong. */
    .flag-box img.no-border {
      border: none;
    }

    /* ---- Classic ---- */
    #classic {
      cursor: pointer;
      padding: var(--top) 16px var(--bottom);
      --name-fs: clamp(22px, 6.5vmin, 46px);
    }

    /* Country name is anchored to a fixed area so it never shifts. */
    #name {
      height: calc(var(--name-fs) * 2.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--name-fs);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.1;
      max-width: 92vw;
    }

    #name.long {
      font-size: calc(var(--name-fs) * 0.78);
    }

    /* Flag size follows whichever is tighter: the width or the free height. */
    #flag-box {
      margin-top: 8px;
      width: min(560px, 92vw, calc((100vh - var(--top) - var(--bottom) - var(--name-fs) * 2.4 - 16px) * 1.5));
      width: min(560px, 92vw, calc((100dvh - var(--top) - var(--bottom) - var(--name-fs) * 2.4 - 16px) * 1.5));
    }

    /* ---- Master (quiz) ---- */
    #master {
      padding: var(--top) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    }

    #quiz {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 560px;
      height: 100%;
    }

    /* The question takes all space left over by the answer grid. */
    #prompt {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .tag {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #888888;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .q-text {
      font-size: clamp(22px, 6.5vmin, 44px);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.15;
    }

    /* Capitals are marked with a star, a tag and a distinct colour. */
    .q-text.capital {
      color: #1d4ed8;
    }

    .q-text.capital::before {
      content: "★ ";
      color: #f5a524;
    }

    #map {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
    }

    #map svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #options {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
    }

    .option {
      border: 3px solid transparent;
      background: #ffffff;
      border-radius: 14px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #111111;
    }

    .option .flag-box {
      width: 100%;
    }

    .option.pressed {
      background: #f0f0f0;
    }

    /* Room for two lines is kept from the start, so revealing the names
       after an answer never changes the layout. */
    .opt-label {
      height: 2.4em;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.2;
      visibility: hidden;
    }

    .answered .opt-label {
      visibility: visible;
    }

    .option.correct {
      border-color: #2e7d32;
      background: #e8f5e9;
    }

    .option.wrong {
      border-color: #c62828;
      background: #ffebee;
      animation: shake 0.3s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .loading {
      color: #999999;
      font-size: 18px;
    }

    /* Phones held sideways: the screen is short, so the control buttons move
       to a column on the right and the content uses the full height. */
    @media (orientation: landscape) and (max-height: 600px) {
      .screen {
        --top: 12px;
        --bottom: 12px;
      }

      .controls {
        top: 50%;
        left: auto;
        right: calc(12px + env(safe-area-inset-right, 0px));
        transform: translateY(-50%);
        flex-direction: column;
        gap: 10px;
        padding: 0;
      }

      #classic,
      #master {
        padding: 12px calc(84px + env(safe-area-inset-right, 0px)) 12px calc(16px + env(safe-area-inset-left, 0px));
      }

      /* Question on the left, answers on the right. */
      #quiz {
        flex-direction: row;
        max-width: none;
      }

      #prompt {
        height: 100%;
      }

      #options {
        width: min(60%, calc((100vh - 80px) * 1.5));
        width: min(60%, calc((100dvh - 80px) * 1.5));
        gap: 6px 10px;
      }

      .option {
        padding: 3px;
        gap: 2px;
      }

      .opt-label {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <!-- Main menu -->
  <section id="menu" class="screen">
    <h1 class="menu-title">Знамена</h1>
    <div class="menu-buttons">
      <button class="menu-btn" type="button" data-go="classic">Класически</button>
      <button class="menu-btn" type="button" data-go="master">Майстор</button>
    </div>
  </section>

  <!-- Classic variant -->
  <section id="classic" class="screen hidden">
    <div class="controls">
      <button class="ctrl" type="button" data-go="menu" aria-label="Меню">⌂</button>
      <button id="prev" class="ctrl" type="button" aria-label="Предишно знаме">‹</button>
      <button id="restart" class="ctrl" type="button" aria-label="Започни отначало">↺</button>
      <button id="next" class="ctrl" type="button" aria-label="Следващо знаме">›</button>
    </div>
    <div id="name">&nbsp;</div>
    <div id="flag-box" class="flag-box">
      <img id="flag" alt="флаг">
    </div>
    <div id="counter" class="counter"></div>
  </section>

  <!-- Master variant: pick the right flag out of four -->
  <section id="master" class="screen hidden">
    <div class="controls">
      <button class="ctrl" type="button" data-go="menu" aria-label="Меню">⌂</button>
      <button id="m-restart" class="ctrl" type="button" aria-label="Започни отначало">↺</button>
      <button id="m-next" class="ctrl" type="button" aria-label="Следващ въпрос">›</button>
    </div>
    <div id="quiz">
      <div id="prompt"></div>
      <div id="options"></div>
    </div>
  </section>

  <script src="countries.js?v=12"></script>
  <script src="vendor/geo.min.js?v=12"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
