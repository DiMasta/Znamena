<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <title>Игра с знамена</title>
  <style>
    /* Colours follow the phone's light/dark theme. */
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #999999;
      --tag: #888888;
      --btn-bg: #f5f5f5;
      --btn-border: #dddddd;
      --btn-text: #333333;
      --btn-pressed: #d4d4d4;
      --menu-pressed: #e6e6e6;
      --option-pressed: #f0f0f0;
      --flag-border: #000000;
      --capital: #1d4ed8;
      --star: #f5a524;
      --good-border: #2e7d32;
      --good-bg: #e8f5e9;
      --bad-border: #c62828;
      --bad-bg: #ffebee;
      --map-ocean: #e8f1f8;
      --map-faded: #f3f3f3;
      --map-land: #d9d9d9;
      --map-border: #ffffff;
      --map-target: #e53935;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #ececec;
        --muted: #8a8a8a;
        --tag: #9a9a9a;
        --btn-bg: #262626;
        --btn-border: #3a3a3a;
        --btn-text: #e0e0e0;
        --btn-pressed: #444444;
        --menu-pressed: #2c2c2c;
        --option-pressed: #262626;
        /* Dark flag parts would blend into the dark page, so a grey border. */
        --flag-border: #6b6b6b;
        --capital: #7aa7ff;
        --star: #f5b942;
        --good-border: #4caf50;
        --good-bg: #1b3320;
        --bad-border: #ef5350;
        --bad-bg: #3a1d1d;
        --map-ocean: #1a2733;
        --map-faded: #222a31;
        --map-land: #4a5058;
        --map-border: #1a2733;
        --map-target: #ff5a52;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      overflow: hidden;
    }

    /* Each variant is a full-screen view; only one is shown at a time. */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      /* Space reserved for the top control bar and the bottom counter. */
      --top: calc(76px + env(safe-area-inset-top, 0px));
      --bottom: calc(56px + env(safe-area-inset-bottom, 0px));
    }

    .hidden {
      display: none;
    }

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      transition: transform 0.08s ease, background-color 0.08s ease;
    }

    /* Press feedback: buttons shrink and darken while held. */
    button.pressed {
      transform: scale(0.92);
    }

    /* ---- Main menu ---- */
    .menu-title {
      font-size: clamp(32px, 8vw, 64px);
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 44px;
      text-transform: uppercase;
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      max-width: 340px;
    }

    .menu-btn {
      border: 2px solid var(--text);
      background: var(--bg);
      color: var(--text);
      border-radius: 14px;
      padding: 20px 24px;
      font-size: 22px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .menu-btn.pressed {
      background: var(--menu-pressed);
    }

    /* ---- Top control bar and bottom counter, shared by the variants ---- */
    .controls {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 16px;
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
      padding-bottom: 14px;
      z-index: 10;
    }

    .ctrl {
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--btn-text);
      border-radius: 12px;
      height: 48px;
      min-width: 58px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }

    .ctrl.pressed {
      background: var(--btn-pressed);
    }

    .counter {
      position: fixed;
      left: 20px;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      font-size: 20px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 1px;
    }

    /* A flag inside a fixed box: identical footprint, border hugs the flag. */
    .flag-box {
      position: relative;
      aspect-ratio: 3 / 2;
    }

    /* Taken out of the flow and centred, so an unusually shaped flag
       (like Nepal's tall one) shrinks to fit instead of stretching the box. */
    .flag-box img {
      position: absolute;
      inset: 0;
      margin: auto;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      border: 1px solid var(--flag-border);
      -webkit-user-drag: none;
    }

    /* Nepal's flag is not rectangular, so a rectangular border looks wrong. */
    .flag-box img.no-border {
      border: none;
    }

    /* ---- Classic ---- */
    #classic {
      cursor: pointer;
      padding: var(--top) 16px var(--bottom);
      --name-fs: clamp(22px, 6.5vmin, 46px);
    }

    /* Country name is anchored to a fixed area so it never shifts. */
    #name {
      height: calc(var(--name-fs) * 2.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--name-fs);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.1;
      max-width: 92vw;
    }

    #name.long {
      font-size: calc(var(--name-fs) * 0.78);
    }

    /* Flag size follows whichever is tighter: the width or the free height. */
    #flag-box {
      margin-top: 8px;
      width: min(560px, 92vw, calc((100vh - var(--top) - var(--bottom) - var(--name-fs) * 2.4 - 16px) * 1.5));
      width: min(560px, 92vw, calc((100dvh - var(--top) - var(--bottom) - var(--name-fs) * 2.4 - 16px) * 1.5));
    }

    /* ---- Master (quiz) ---- */
    #master {
      padding: var(--top) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    }

    #quiz {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 560px;
      height: 100%;
    }

    /* The question takes all space left over by the answer grid. */
    #prompt {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .tag {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--tag);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .q-text {
      font-size: clamp(22px, 6.5vmin, 44px);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.15;
    }

    /* Capitals are marked with a star, a tag and a distinct colour. */
    .q-text.capital {
      color: var(--capital);
    }

    .q-text.capital::before {
      content: "★ ";
      color: var(--star);
    }

    /* Ocean colour shows while a map is still being painted. */
    .map {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: var(--map-ocean);
    }

    .map svg,
    .map canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Map colours (the map itself is drawn by app.js). */
    .m-ocean {
      fill: var(--map-ocean);
    }

    .m-faded {
      fill: var(--map-faded);
      stroke: var(--map-ocean);
      stroke-width: 0.6;
    }

    .m-land {
      fill: var(--map-land);
      stroke: var(--map-border);
      stroke-width: 0.6;
    }

    .m-target {
      fill: var(--map-target);
      stroke: var(--map-border);
      stroke-width: 0.6;
    }

    /* Small countries: a bold red outline makes tiny islands visible... */
    .m-target.m-small {
      stroke: var(--map-target);
      stroke-width: 2.5;
      stroke-linejoin: round;
    }

    /* ...and a soft glow around them catches the eye. Opacity is applied to
       the whole shape at once, so nearby islands blend into one patch. */
    .m-glow {
      fill: var(--map-target);
      stroke: var(--map-target);
      stroke-width: 22;
      stroke-linejoin: round;
      stroke-linecap: round;
      opacity: 0.45;
    }

    #options {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
    }

    .option {
      border: 3px solid transparent;
      background: var(--bg);
      border-radius: 14px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text);
    }

    .option .flag-box {
      width: 100%;
    }

    .option.pressed {
      background: var(--option-pressed);
    }

    /* Room for two lines is kept from the start, so revealing the names
       after an answer never changes the layout. */
    .opt-label {
      height: 2.4em;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.2;
      visibility: hidden;
    }

    .answered .opt-label {
      visibility: visible;
    }

    .option.correct {
      border-color: var(--good-border);
      background: var(--good-bg);
    }

    .option.wrong {
      border-color: var(--bad-border);
      background: var(--bad-bg);
      animation: shake 0.3s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .loading {
      color: var(--muted);
      font-size: 18px;
    }

    /* ---- Learn: pick a list, then swipe through country cards ---- */
    #learn .menu-title {
      margin-bottom: 28px;
    }

    .learn-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
      max-width: 440px;
    }

    .learn-grid .menu-btn {
      padding: 16px 10px;
      font-size: 17px;
      line-height: 1.2;
    }

    /* The cards scroll under the fixed control bar, and every swipe snaps to
       exactly one card, like short-video apps. */
    #cards {
      padding: 0;
    }

    #cards-scroll {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }

    #cards-scroll::-webkit-scrollbar {
      display: none;
    }

    .lcard {
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: var(--top) 16px calc(16px + env(safe-area-inset-bottom, 0px));
      overflow: hidden;
    }

    .lc-info {
      flex: 0 0 auto;
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .lc-name {
      font-size: clamp(22px, 6.5vmin, 40px);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.15;
    }

    .lc-flag {
      width: min(56%, 280px);
      margin: 2px 0;
    }

    .lc-info .tag {
      margin: 2px 0 0;
    }

    .q-text.lc-capital {
      font-size: clamp(18px, 5vmin, 30px);
    }

    .lc-area {
      font-size: 15px;
      color: var(--muted);
    }

    /* Map and fact share the rest of the card; the map takes what is left. */
    .lc-side {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .lc-map {
      min-height: 90px;
    }

    .lc-fact {
      flex: 0 0 auto;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--btn-bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.4;
      text-align: center;
    }

    .lc-fact::before {
      content: "💡💡💡";
      display: block;
      margin-bottom: 4px;
      font-size: 18px;
      letter-spacing: 6px;
    }

    /* Position in the list, shown in the control bar next to the buttons. */
    /* Fixed width with even-width digits, so the bar never shifts as the
       number changes (e.g. 9/45 to 10/45). */
    .ctrl-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 84px;
      height: 48px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    /* Phones held sideways: the screen is short, so the control buttons move
       to a column on the right and the content uses the full height. */
    @media (orientation: landscape) and (max-height: 600px) {
      .screen {
        --top: 12px;
        --bottom: 12px;
      }

      .controls {
        top: 50%;
        left: auto;
        right: calc(12px + env(safe-area-inset-right, 0px));
        transform: translateY(-50%);
        flex-direction: column;
        gap: 10px;
        padding: 0;
      }

      #classic,
      #master,
      #learn {
        padding: 12px calc(84px + env(safe-area-inset-right, 0px)) 12px calc(16px + env(safe-area-inset-left, 0px));
      }

      /* Learn: list buttons in one wide grid; each card has its details on
         the left and the map with the fact on the right. */
      #learn .menu-title {
        margin-bottom: 14px;
        font-size: 28px;
      }

      .learn-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        max-width: 680px;
      }

      .learn-grid .menu-btn {
        padding: 12px 8px;
        font-size: 15px;
      }

      /* The right padding clears the button column, which here also holds
         the wider position counter. */
      .lcard {
        flex-direction: row;
        align-items: stretch;
        padding: 12px calc(108px + env(safe-area-inset-right, 0px)) 12px calc(16px + env(safe-area-inset-left, 0px));
      }

      .lc-info {
        flex: 1 1 0;
        min-width: 0;
        justify-content: center;
      }

      .lc-flag {
        width: min(70%, calc((100vh - 150px) * 1.5));
        width: min(70%, calc((100dvh - 150px) * 1.5));
      }

      .lc-side {
        flex: 1.3 1 0;
        max-width: none;
      }

      .lc-fact {
        font-size: 13px;
        padding: 8px 10px;
      }

      /* Question on the left, answers on the right. */
      #quiz {
        flex-direction: row;
        max-width: none;
      }

      #prompt {
        height: 100%;
      }

      #options {
        width: min(60%, calc((100vh - 80px) * 1.5));
        width: min(60%, calc((100dvh - 80px) * 1.5));
        gap: 6px 10px;
      }

      .option {
        padding: 3px;
        gap: 2px;
      }

      .opt-label {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <!-- Main menu -->
  <section id="menu" class="screen">
    <h1 class="menu-title">Знамена</h1>
    <div class="menu-buttons">
      <button class="menu-btn" type="button" data-go="classic">Класически</button>
      <button class="menu-btn" type="button" data-go="master">Майстор</button>
      <button class="menu-btn" type="button" data-go="learn">Учи</button>
    </div>
  </section>

  <!-- Classic variant -->
  <section id="classic" class="screen hidden">
    <div class="controls">
      <button class="ctrl" type="button" data-go="menu" aria-label="Меню">⌂</button>
      <button id="prev" class="ctrl" type="button" aria-label="Предишно знаме">‹</button>
      <button id="restart" class="ctrl" type="button" aria-label="Започни отначало">↺</button>
      <button id="next" class="ctrl" type="button" aria-label="Следващо знаме">›</button>
    </div>
    <div id="name">&nbsp;</div>
    <div id="flag-box" class="flag-box">
      <img id="flag" alt="флаг">
    </div>
    <div id="counter" class="counter"></div>
  </section>

  <!-- Master variant: pick the right flag out of four -->
  <section id="master" class="screen hidden">
    <div class="controls">
      <button class="ctrl" type="button" data-go="menu" aria-label="Меню">⌂</button>
      <button id="m-prev" class="ctrl" type="button" aria-label="Предишен въпрос">‹</button>
      <button id="m-restart" class="ctrl" type="button" aria-label="Започни отначало">↺</button>
      <button id="m-next" class="ctrl" type="button" aria-label="Следващ въпрос">›</button>
    </div>
    <div id="quiz">
      <div id="prompt"></div>
      <div id="options"></div>
    </div>
  </section>

  <!-- Learn: choose which countries to learn -->
  <section id="learn" class="screen hidden">
    <div class="controls">
      <button class="ctrl" type="button" data-go="menu" aria-label="Меню">⌂</button>
    </div>
    <h1 class="menu-title">Учи</h1>
    <div class="learn-grid">
      <button class="menu-btn" type="button" data-list="europe">Европа</button>
      <button class="menu-btn" type="button" data-list="asia">Азия</button>
      <button class="menu-btn" type="button" data-list="africa">Африка</button>
      <button class="menu-btn" type="button" data-list="northamerica">Северна Америка</button>
      <button class="menu-btn" type="button" data-list="southamerica">Южна Америка</button>
      <button class="menu-btn" type="button" data-list="oceania">Океания</button>
      <button class="menu-btn" type="button" data-list="all">Всички А–Я</button>
      <button class="menu-btn" type="button" data-list="area">Всички по площ</button>
    </div>
  </section>

  <!-- Learn: one card per country; swipe up for the next one -->
  <section id="cards" class="screen hidden">
    <div class="controls">
      <button class="ctrl" type="button" data-go="learn" aria-label="Назад">←</button>
      <button id="cards-reset" class="ctrl" type="button" aria-label="Към първата карта">↺</button>
      <div id="cards-pos" class="ctrl-label"></div>
    </div>
    <div id="cards-scroll"></div>
  </section>

  <script src="countries.js?v=24"></script>
  <script src="facts.js?v=24"></script>
  <script src="vendor/geo.min.js?v=24"></script>
  <script src="app.js?v=24"></script>
</body>
</html>
